[package]
name = "quran-importer"
version = "0.1.0"
edition = "2021"
description = "Tanzil data importer — converts Quran XML to the app's SQLite database"
license = "MIT"

[[bin]]
name = "quran-importer"
path = "src/main.rs"

[dependencies]
rusqlite   = { version = "0.32", features = ["bundled"] }
ureq       = { version = "2", features = [] }
quick-xml  = { version = "0.41" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"
indicatif  = "0.18"
